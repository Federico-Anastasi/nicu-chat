<text x="554.0" y="293.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#16283c">Web Worker</text>
<text x="554.0" y="315.0" text-anchor="middle" font-size="12" fill="#5b7690">off the UI thread</text>
<path d="M670,300 L702,300" stroke="#9db4c8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<g filter="url(#soft)"><rect x="704" y="246" width="216" height="108" rx="14" fill="url(#acc)" stroke="#c4520a" stroke-width="1.5"/></g>
<text x="812.0" y="293.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">ONNX Runtime Web</text>
<text x="812.0" y="315.0" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)">WASM · model kept in cache</text>
<path d="M262,200 L418,116" stroke="#9db4c8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="340" y="132" text-anchor="middle" font-size="12" fill="#5b7690">POST /api/chat</text>
<path d="M262,236 L418,300" stroke="#9db4c8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
