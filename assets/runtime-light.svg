<text x="150.0" y="211.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#16283c">React chat UI</text>
<text x="150.0" y="233.0" text-anchor="middle" font-size="12" fill="#5b7690">streams tokens into the bubble</text>
<rect x="420" y="24" width="520" height="168" rx="18" fill="#f2f6fa" stroke="#dbe5ee" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="440" y="54" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#5b7690">SERVER · DEFAULT</text>
