<text x="554.0" y="109.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#16283c">nicu-infer</text>
<text x="554.0" y="131.0" text-anchor="middle" font-size="12" fill="#5b7690">rate limit · queue · SSE stream</text>
<path d="M670,116 L702,116" stroke="#9db4c8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<g filter="url(#soft)"><rect x="704" y="62" width="216" height="108" rx="14" fill="url(#acc)" stroke="#c4520a" stroke-width="1.5"/></g>
<text x="812.0" y="109.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">4 worker processes</text>
<text x="812.0" y="131.0" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)">ONNX Runtime Node · KV cache</text>
<rect x="420" y="208" width="520" height="168" rx="18" fill="#f2f6fa" stroke="#dbe5ee" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="440" y="238" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#5b7690">ON YOUR DEVICE · OPTIONAL</text>
