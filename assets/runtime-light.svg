<rect x="20" y="392" width="920" height="30" rx="10" fill="#ffffff" stroke="#d5e0ea" stroke-width="1.5"/>
<text x="480" y="412" text-anchor="middle" font-size="12.5" fill="#16283c">same core on both sides (web/src/core): BPE tokenizer · prompt window · sampling · generation loop</text>
