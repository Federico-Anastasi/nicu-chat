<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(30,50,70,0.18)"/>
  </filter>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e86a2b"/>
    <stop offset="1" stop-color="#c4520a"/>
  </linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e86a2b"/>
  </marker>
</defs>
<rect x="20" y="24" width="260" height="352" rx="18" fill="#f2f6fa" stroke="#dbe5ee" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="40" y="54" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#5b7690">BROWSER</text>
